<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>The Grand Masala Hut — Digital Menu</title>
  <meta name="description" content="Authentic, flavorful, and premium Indian cuisine — eat with delight and savor every bite.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!--
    ╔══════════════════════════════════════════════════════════════╗
    ║  IMAGE FILE CONVENTIONS                                     ║
    ╠══════════════════════════════════════════════════════════════╣
    ║                                                              ║
    ║  OFFER IMAGES — replace files in /images/offers/             ║
    ║    grand-feast-combo.jpg, tandoori-duo-combo.jpg, etc.       ║
    ║                                                              ║
    ║  CATEGORY IMAGES — replace files in /images/categories/      ║
    ║    starters.jpg, tandoor-grill.jpg, etc.                     ║
    ║                                                              ║
    ║  DISH IMAGES — replace files in /images/dishes/              ║
    ║    butter-chicken.jpg, paneer-tikka.jpg, etc.                ║
    ║                                                              ║
    ╚══════════════════════════════════════════════════════════════╝
  -->
  <style>
    /* ─────────────────────────────────────────────
       CSS CUSTOM PROPERTIES / DESIGN TOKENS
    ───────────────────────────────────────────── */
    :root {
      --spice-red: #D71920;
      --saffron-yellow: #FFD400;
      --royal-gold: #D4AF37;
      --charcoal-black: #1A1A1A;
      --charcoal-card: #242424;
      --charcoal-deep: #1E1E1E;
      --warm-cream: #F5EFE1;
      --leaf-green: #2E7D32;
      --muted-cream: #b8b0a0;
      --font-heading: 'Playfair Display', Georgia, serif;
      --font-body: 'Montserrat', 'Segoe UI', sans-serif;
    }

    /* ─────────────────────────────────────────────
       RESET & BASE
    ───────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font-body);
      background: var(--charcoal-black);
      color: var(--warm-cream);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    img { max-width: 100%; display: block; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    a { color: inherit; text-decoration: none; }

    /* ─────────────────────────────────────────────
       SPLASH SCREEN
    ───────────────────────────────────────────── */
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      background: var(--charcoal-black);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      transition: opacity .6s ease, visibility .6s ease;
    }
    #splash.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .splash-logo-wrap {
      width: 240px; max-width: 60vw; margin-bottom: 12px;
      opacity: 0; -webkit-clip-path: inset(100% 0 0 0); clip-path: inset(100% 0 0 0); transform: scale(0.96);
      animation: wipeUp 1s ease-out forwards, fadeIn 0.6s ease-out forwards, scaleUp 0.3s ease-out 0.9s forwards;
    }
    
    .splash-logo-img { width: 100%; height: auto; }
    
    .splash-logo-fallback {
      font-family: var(--font-heading); font-size: 26px; font-weight: 700;
      text-align: center; color: var(--royal-gold); line-height: 1.2;
    }

    .splash-tagline {
      font-family: var(--font-body); font-size: 13px; font-style: italic; color: var(--warm-cream);
      margin-top: 4px; opacity: 0; transform: translateY(8px);
      animation: taglineFade 0.5s ease-out 1.3s forwards;
    }

    @keyframes wipeUp { to { -webkit-clip-path: inset(0 0 0 0); clip-path: inset(0 0 0 0); } }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes scaleUp { to { transform: scale(1); } }
    @keyframes taglineFade { to { opacity: 1; transform: translateY(0); } }

    @media (prefers-reduced-motion: reduce) {
      .splash-logo-wrap, .splash-tagline {
        animation: fadeIn 0.5s ease-out forwards !important;
        animation-delay: 0s !important;
        opacity: 0;
        transform: none !important;
        -webkit-clip-path: none !important;
        clip-path: none !important;
      }
    }

    /* ─────────────────────────────────────────────
       HEADER
    ───────────────────────────────────────────── */
    #site-header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(26,26,26,.92);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(212,175,55,.15);
      transition: padding .3s ease, box-shadow .3s ease;
      padding: 14px 16px;
    }
    #site-header.compact { padding: 8px 16px; box-shadow: 0 2px 20px rgba(0,0,0,.5); }
    .header-inner { display: flex; align-items: center; justify-content: space-between; max-width: 640px; margin: 0 auto; }
    .header-left { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .header-logo-img { height: 36px; width: auto; flex-shrink: 0; transition: height .3s; }
    #site-header.compact .header-logo-img { height: 28px; }



    /* ─────────────────────────────────────────────
       SCREENS MANAGEMENT
    ───────────────────────────────────────────── */
    .screen { display: none; }
    .screen.active { display: block; animation: fadeIn .5s ease; }

    /* ─────────────────────────────────────────────
       SCREEN 2 — DAILY OFFERS
    ───────────────────────────────────────────── */
    .offers-screen {
      position: relative; min-height: calc(100vh - 56px);
      display: flex; flex-direction: column; align-items: center; text-align: center;
      padding: 32px 20px 36px; overflow: hidden;
    }
    .offers-screen::before {
      content: ''; position: absolute; inset: 0;
      background:
        radial-gradient(ellipse at 50% 20%, rgba(215,25,32,.1) 0%, transparent 55%),
        radial-gradient(ellipse at 30% 80%, rgba(255,212,0,.05) 0%, transparent 45%),
        radial-gradient(ellipse at 75% 60%, rgba(212,175,55,.07) 0%, transparent 50%);
      z-index: 0;
    }
    .offers-content { position: relative; z-index: 1; width: 100%; max-width: 520px; }


    /* Offer Card with Image */
    .offer-card {
      background: var(--charcoal-card);
      border: 1px solid var(--royal-gold);
      border-radius: 14px;
      text-align: left;
      position: relative;
      overflow: hidden;
      width: 280px;
      flex-shrink: 0;
    }

    .offer-img-wrap {
      position: relative; width: 100%; padding-top: 50%; /* 2:1 aspect */
      background: var(--charcoal-deep); overflow: hidden;
      border-bottom: 1px solid rgba(212,175,55,.15);
    }
    .offer-img-wrap img { position: absolute; z-index: 1; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .offer-placeholder {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 50%, rgba(212,175,55,.06) 0%, transparent 70%), var(--charcoal-deep); z-index: 0;
    }
    .offer-placeholder svg { width: 32px; height: 32px; opacity: .3; }

    .offer-card-body { padding: 16px 20px; }
    .offer-card .offer-badge {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--spice-red); color: #fff;
      font-family: var(--font-body); font-size: 9px; font-weight: 700;
      letter-spacing: .8px; text-transform: uppercase;
      padding: 3px 10px; border-radius: 4px; margin-bottom: 10px; line-height: 1.3;
    }
    .offer-badge svg { width: 10px; height: 10px; fill: var(--saffron-yellow); }

    .offer-name { font-family: var(--font-heading); font-size: 18px; font-weight: 700; color: var(--warm-cream); line-height: 1.3; margin-bottom: 4px; }
    .offer-desc { font-size: 12px; font-weight: 400; color: var(--muted-cream); line-height: 1.5; margin-bottom: 10px; }
    .offer-pricing { display: flex; align-items: baseline; gap: 10px; }
    .offer-original-price { font-family: var(--font-body); font-size: 14px; font-weight: 500; color: var(--muted-cream); text-decoration: line-through; opacity: .65; }
    .offer-price { font-family: var(--font-body); font-size: 20px; font-weight: 700; color: var(--saffron-yellow); }

    .offers-section-title {
      font-family: var(--font-body); font-size: 16px; font-weight: 700;
      color: var(--royal-gold); text-align: center; margin-bottom: 4px;
      letter-spacing: 3px; text-transform: uppercase;
    }
    .offers-date {
      font-family: var(--font-body); font-size: 11px; font-weight: 500;
      color: var(--muted-cream); text-align: center; margin-bottom: 20px;
    }

    /* Carousel Styles */
    .carousel-wrapper {
      width: 100vw;
      margin-left: calc(-50vw + 50%);
      margin-bottom: 24px;
      overflow: hidden;
      position: relative;
      mask-image: linear-gradient(to right, transparent, black 8%, black 92%, transparent);
      -webkit-mask-image: linear-gradient(to right, transparent, black 8%, black 92%, transparent);
      padding: 10px 0;
      opacity: 0; transform: translateY(28px);
    }
    .carousel-wrapper.visible {
      opacity: 1; transform: translateY(0);
      transition: opacity .6s ease, transform .6s ease;
    }
    @media (min-width: 600px) {
      .carousel-wrapper {
         width: 100%;
         margin-left: 0;
         mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent);
         -webkit-mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent);
      }
    }
    .carousel-track {
      display: flex;
      gap: 16px;
      width: max-content;
      animation: scrollLeft 25s linear infinite;
      will-change: transform;
      padding: 0 8px; /* half gap padding */
    }
    .carousel-set {
      display: flex;
      gap: 16px;
    }
    @keyframes scrollLeft {
      0% { transform: translateX(0); }
      100% { transform: translateX(calc(-50% - 8px)); }
    }
    .carousel-track.paused {
      animation-play-state: paused;
    }
    @media (prefers-reduced-motion: reduce) {
      .carousel-wrapper {
        overflow-x: auto;
        mask-image: none;
        -webkit-mask-image: none;
        scroll-snap-type: x mandatory;
        padding-bottom: 20px;
      }
      .carousel-track {
        animation: none;
        width: auto;
      }
      .carousel-wrapper::-webkit-scrollbar { height: 4px; }
      .carousel-wrapper::-webkit-scrollbar-thumb { background: rgba(212,175,55,0.4); border-radius: 4px; }
      .offer-card { scroll-snap-align: start; }
      .carousel-set:nth-child(2) { display: none; }
    }

    /* View Full Menu CTA */
    .view-menu-cta {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; margin-top: 8px; padding: 15px 28px;
      background: var(--spice-red); color: var(--warm-cream);
      font-family: var(--font-body); font-size: 14px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase;
      border: 1px solid var(--royal-gold); border-radius: 30px;
      cursor: pointer; transition: background .2s, transform .2s, box-shadow .2s;
      opacity: 0; transform: translateY(16px);
    }
    .view-menu-cta.visible { opacity: 1; transform: translateY(0); transition: opacity .5s ease, transform .5s ease, background .2s, box-shadow .2s; }
    .view-menu-cta:hover { background: #bf151b; transform: scale(1.02); box-shadow: 0 4px 24px rgba(215,25,32,.3); }
    .view-menu-cta svg { width: 18px; height: 18px; fill: var(--warm-cream); flex-shrink: 0; }

    /* ─────────────────────────────────────────────
       GOLD ORNAMENTAL DIVIDER
    ───────────────────────────────────────────── */
    .gold-divider { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 20px 24px; }
    .gold-divider .line { flex: 1; max-width: 100px; height: 1px; background: linear-gradient(90deg, transparent, var(--royal-gold), transparent); }
    .gold-divider .mandala { width: 24px; height: 24px; flex-shrink: 0; }

    /* ─────────────────────────────────────────────
       SCREEN 3 — CATEGORY GRID
    ───────────────────────────────────────────── */
    .section-title {
      font-family: var(--font-heading); font-size: 26px; font-weight: 700;
      color: var(--warm-cream); text-align: center; margin-bottom: 24px;
      letter-spacing: 0.5px;
    }
    .category-grid-section { max-width: 640px; margin: 0 auto; padding: 0 16px 32px; }

    .category-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }

    .cat-tile {
      position: relative; border-radius: 14px; overflow: hidden;
      border: 1px solid var(--royal-gold); cursor: pointer;
      background: var(--charcoal-deep);
      transition: transform .25s ease, box-shadow .25s ease;
      opacity: 0; transform: translateY(20px);
    }
    .cat-tile.visible { animation: slideUp .5s ease forwards; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    .cat-tile:hover { transform: translateY(-3px); box-shadow: 0 8px 32px rgba(0,0,0,.4); }
    .cat-tile:active { transform: scale(.97); }

    .cat-tile-content {
      padding: 24px 16px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; min-height: 100px;
    }
    .cat-tile-name { font-family: var(--font-heading); font-size: 16px; font-weight: 700; color: var(--warm-cream); line-height: 1.2; }
    .cat-tile-count { font-family: var(--font-body); font-size: 10px; font-weight: 500; color: var(--muted-cream); margin-top: 6px; letter-spacing: .3px; }

    /* ─────────────────────────────────────────────
       SCREEN 4 — CATEGORY DETAIL
    ───────────────────────────────────────────── */
    .detail-section { max-width: 640px; margin: 0 auto; padding: 0 16px 40px; }
    .detail-top-bar { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; padding-top: 10px; }
    .detail-cat-title { font-family: var(--font-heading); font-size: 22px; font-weight: 700; color: var(--warm-cream); letter-spacing: .5px; margin: 0; line-height: 1; }
    .back-btn {
      display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; flex-shrink: 0;
      border: 1px solid rgba(212,175,55,.25); border-radius: 50%; transition: all .2s; cursor: pointer; background: transparent; padding: 0;
    }
    .back-btn:hover { background: rgba(212,175,55,.1); border-color: var(--royal-gold); }
    .back-btn svg { width: 18px; height: 18px; fill: var(--royal-gold); }



    .dish-card {
      background: var(--charcoal-card); border: 1px solid rgba(212,175,55,.12); border-radius: 12px;
      padding: 12px; margin-bottom: 12px; position: relative; display: flex; gap: 14px; align-items: flex-start;
      transition: border-color .25s ease, box-shadow .25s ease; opacity: 0; transform: translateY(20px);
    }
    .dish-card.visible { opacity: 1; transform: translateY(0); transition: opacity .45s ease, transform .45s ease, border-color .25s ease; }
    .dish-card:hover { border-color: rgba(212,175,55,.25); box-shadow: 0 4px 24px rgba(0,0,0,.3); }

    .dish-thumb { position: relative; width: 80px; height: 80px; border-radius: 10px; overflow: hidden; flex-shrink: 0; background: var(--charcoal-deep); }
    .dish-thumb img { position: relative; z-index: 1; width: 100%; height: 100%; object-fit: cover; transition: opacity .3s; }
    .dish-thumb-placeholder {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 50%, rgba(212,175,55,.06) 0%, transparent 70%), var(--charcoal-deep); z-index: 0;
    }
    .dish-thumb-placeholder svg { width: 24px; height: 24px; opacity: .3; }

    .dish-thumb .veg-indicator {
      position: absolute; top: 4px; left: 4px; z-index: 3; width: 14px; height: 14px;
      border: 1.5px solid var(--leaf-green); border-radius: 2px; display: flex; align-items: center; justify-content: center; background: rgba(26,26,26,.75);
    }
    .dish-thumb .veg-indicator .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--leaf-green); }
    .dish-thumb .veg-indicator.non-veg { border-color: var(--spice-red); }
    .dish-thumb .veg-indicator.non-veg .dot { background: var(--spice-red); }

    .dish-body { flex: 1; min-width: 0; }
    .dish-top-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .dish-info { flex: 1; min-width: 0; }
    .dish-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    
    .badge {
      display: inline-flex; align-items: center; gap: 3px; background: var(--spice-red); color: #fff;
      font-size: 8px; font-weight: 700; letter-spacing: .7px; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; line-height: 1.3;
    }
    .badge svg { width: 9px; height: 9px; fill: var(--saffron-yellow); }

    .dish-name { font-family: var(--font-heading); font-size: 15px; font-weight: 700; color: var(--warm-cream); line-height: 1.25; margin-bottom: 3px; }
    .dish-desc { font-size: 11px; font-weight: 400; color: var(--muted-cream); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .dish-price { font-family: var(--font-body); font-size: 15px; font-weight: 700; color: var(--saffron-yellow); white-space: nowrap; flex-shrink: 0; padding-top: 1px; }
    
    .dish-price-options { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .price-pill { display: flex; align-items: center; border: 1px solid rgba(212,175,55,.3); border-radius: 4px; overflow: hidden; background: rgba(0,0,0,.2); }
    .pill-label { background: rgba(212,175,55,.1); color: var(--muted-cream); font-size: 10px; font-weight: 600; padding: 4px 6px; text-transform: uppercase; }
    .pill-value { color: var(--saffron-yellow); font-size: 11px; font-weight: 700; padding: 4px 6px; }

    /* ─────────────────────────────────────────────
       FOOTER
    ───────────────────────────────────────────── */
    .site-footer { text-align: center; padding: 20px 24px 40px; max-width: 640px; margin: 0 auto; border-top: 1px solid rgba(212,175,55,.25); }
    .footer-info { font-size: 12px; color: var(--muted-cream); line-height: 1.7; margin-bottom: 12px; }
    .footer-tagline { font-family: var(--font-body); font-size: 13px; font-style: italic; color: var(--royal-gold); }

    /* ─────────────────────────────────────────────
       SCROLL-REVEAL
    ───────────────────────────────────────────── */
    .reveal { opacity: 0; transform: translateY(20px); transition: opacity .6s ease, transform .6s ease; }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    /* ─────────────────────────────────────────────
       RESPONSIVE
    ───────────────────────────────────────────── */
    @media (min-width: 480px) { .dish-thumb { width: 88px; height: 88px; } .dish-name { font-size: 16px; } }
    @media (min-width: 600px) {
      .offers-screen { padding: 40px 32px 48px; } .offer-name { font-size: 20px; } .offer-desc { font-size: 13px; }
      .category-grid { gap: 16px; } .cat-tile-name { font-size: 18px; }
      .dish-thumb { width: 96px; height: 96px; } .dish-card { padding: 14px; } .dish-name { font-size: 17px; } .dish-desc { font-size: 12px; } .section-header h2 { font-size: 26px; }
    }
    @media (min-width: 900px) {
      .category-grid-section, .detail-section { max-width: 720px; } .category-grid { grid-template-columns: repeat(3, 1fr); }
      .offers-content { max-width: 580px; }
    }
    /* ─────────────────────────────────────────────
       SEARCH BAR
    ───────────────────────────────────────────── */
    .search-container { position: relative; margin-bottom: 24px; }
    .search-input { 
      width: 100%; background: var(--charcoal-deep); border: 1px solid var(--royal-gold); 
      border-radius: 12px; padding: 14px 44px; color: var(--warm-cream); 
      font-family: var(--font-body); font-size: 15px; outline: none; transition: box-shadow 0.2s;
    }
    .search-input::placeholder { color: rgba(250, 240, 230, 0.4); font-family: var(--font-heading); }
    .search-input:focus { box-shadow: 0 0 0 1px var(--royal-gold); }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--royal-gold); }
    .search-clear { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--muted-cream); cursor: pointer; display: none; }
    .search-clear.visible { display: block; }
    .search-result-cat-label { font-size: 10px; color: var(--royal-gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; font-weight: 600; }
  </style>
</head>
<body>
  <!-- ═══════════════════════════════════════════
       SPLASH SCREEN (Screen 1)
  ═══════════════════════════════════════════ -->
  <div id="splash" aria-label="Loading">
    <div class="splash-logo-wrap">
      <img class="splash-logo-img" src="images/logo-full-cropped.png" alt="The Grand Masala Hut Logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
      <div class="splash-logo-fallback" style="display:none;">The Grand Masala Hut</div>
    </div>
    <div class="splash-tagline">Eat with delight and savor every bite.</div>
  </div>

  <!-- ═══════════════════════════════════════════
       HEADER
  ═══════════════════════════════════════════ -->
  <header id="site-header">
    <div class="header-inner">
      <div class="header-left" id="headerLogo">
        <img class="header-logo-img" src="images/logo-full-cropped.png" alt="The Grand Masala Hut">
      </div>
    </div>
  </header>

  <!-- ═══════════════════════════════════════════
       SCREEN 2 — TODAY'S OFFERS
  ═══════════════════════════════════════════ -->
  <div id="screenOffers" class="screen">
    <section class="offers-screen">
      <div class="offers-content">
        <h2 class="offers-section-title">TODAY'S OFFERS</h2>
        <div class="offers-date" id="offersDate"></div>
        <div id="todaysOffersContainer" class="carousel-wrapper"></div>

        <div class="gold-divider" style="padding: 10px 0 20px;">
          <span class="line"></span>

  <!-- ═══════════════════════════════════════════
       JAVASCRIPT — DATA + LOGIC
  ═══════════════════════════════════════════ -->
  <script>
    /* ────────────────────────────────────────
       DATA: OFFERS & MENU
    ──────────────────────────────────────── */


    let allMenuItems = [];

    const categoryOrder = [
      "BreakFast", "Kerala Curries", "Salad", "Starter Food Items", "Shawai - Grill", 
      "Indian Bread", "Shawarma", "Meals", "Vegetable Curry", "Fish Curry", 
      "Hot Beverages", "Mojitto", "Cool Beverages", "Falooda", "Shakes", 
      "Fresh Juice", "Fried Rice", "Non-Veg Curry (Continental-Chinese)", 
      "Noodles", "Veg Soup", "Non-Veg Soup", "Evening Bites", "Alfahm", 
      "Grand Special Recipe", "Fries", "Burger", "Mandhi"
    ];

    /* ────────────────────────────────────────
       SVG FRAGMENTS & UTILS
    ──────────────────────────────────────── */
    const SVG_ARCH = `<svg viewBox="0 0 200 200" fill="none"><path d="M40 170 L40 90 Q40 30 100 30 Q160 30 160 90 L160 170" stroke="#D4AF37" stroke-width="5" fill="none" stroke-linecap="round"/></svg>`;
    const SVG_ARCH_ICON = `<svg class="arch-icon" viewBox="0 0 200 200" fill="none"><path d="M40 170 L40 90 Q40 30 100 30 Q160 30 160 90 L160 170" stroke="#D4AF37" stroke-width="6" fill="none" stroke-linecap="round"/></svg>`;
    const SVG_LEAF = `<svg viewBox="0 0 20 20" fill="none" stroke="#D4AF37" stroke-width="1"><path d="M10 18 C10 18 3 12 3 7 Q3 2 10 2 Q17 2 17 7 C17 12 10 18 10 18z"/><line x1="10" y1="18" x2="10" y2="7"/><line x1="10" y1="10" x2="7" y2="7.5"/><line x1="10" y1="12" x2="13" y2="9.5"/></svg>`;
    const SVG_FLAME = `<svg viewBox="0 0 16 16"><path d="M8 1C8 1 3 6 3 10a5 5 0 0010 0C13 6 8 1 8 1zm0 12.5A3.5 3.5 0 014.5 10c0-2.1 2.2-5.3 3.5-7 1.3 1.7 3.5 4.9 3.5 7A3.5 3.5 0 018 13.5z"/></svg>`;
    const SVG_STAR = `<svg viewBox="0 0 16 16"><polygon points="8,1 10,6 15.5,6 11,9.5 12.5,15 8,11.5 3.5,15 5,9.5 0.5,6 6,6"/></svg>`;
    const SVG_CLOCK = `<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.2" fill="none"/><polyline points="8,4 8,8 11,10" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

    function handleImgError(img) {
      img.style.display = 'none';
      img.removeAttribute('data-placeholder');
    }

    /* ────────────────────────────────────────
       SCREEN FLOW MANAGEMENT
    ──────────────────────────────────────── */
    const menuShared = document.getElementById('menuShared');
    const siteFooter = document.getElementById('siteFooter');

    function showScreen(id, pushHistory = true) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      window.scrollTo({ top: 0, behavior: 'instant' });

      // Shared menu elements (Hero + Footer) only show on Grid and Detail screens
      if (id === 'screenGrid' || id === 'screenDetail') {
        menuShared.style.display = 'block';
        siteFooter.style.display = 'block';
      } else {
        menuShared.style.display = 'none';
        siteFooter.style.display = 'none';
      }

      if (pushHistory) {
        history.pushState({ screen: id, catId: currentCatId }, "", "");
      }
    }

    // Handle back button / swipe gesture
    window.addEventListener('popstate', (e) => {
      if (e.state && e.state.screen) {
        if (e.state.screen === 'screenDetail' && e.state.catId) {
          currentCatId = e.state.catId;
          document.getElementById('detailCatTitle').textContent = currentCatId;
        }
        showScreen(e.state.screen, false);
      } else {
        showScreen('screenOffers', false);
      }
    });

    if (!history.state) {
      history.replaceState({ screen: 'screenOffers' }, "", "");
    }

    // Logo click returns to offers & acts as secret admin button (5 clicks)
    let logoClickCount = 0;
    let logoClickTimer;
    document.getElementById('headerLogo').addEventListener('click', () => {
      logoClickCount++;
      clearTimeout(logoClickTimer);
      if (logoClickCount >= 5) {
        window.location.href = 'admin.html';
        return;
      }
      logoClickTimer = setTimeout(() => {
        logoClickCount = 0;
      }, 1000);

      showScreen('screenOffers');
      animateOffers();
    });

    document.getElementById('offersDate').textContent = new Date().toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'long' });

    function renderOfferCards(offersArray) {
      const cardsHTML = offersArray.map(offer => {
        let badgeIcon = SVG_FLAME;
        if (offer.badge.toLowerCase().includes('limited')) badgeIcon = SVG_CLOCK;
        if (offer.badge.toLowerCase().includes('chef')) badgeIcon = SVG_STAR;
        
        const originalHTML = offer.originalPrice ? `<span class="offer-original-price">₹${offer.originalPrice}</span>` : '';
        return `
          <div class="offer-card">
            <div class="offer-img-wrap">
              <div class="offer-placeholder">${SVG_ARCH}</div>
              <img src="${offer.image}" alt="${offer.name}" data-placeholder="true" onerror="handleImgError(this)" loading="lazy">
            </div>
            <div class="offer-card-body">
              <span class="offer-badge">${badgeIcon} ${offer.badge}</span>
              <h3 class="offer-name">${offer.name}</h3>
              <p class="offer-desc">${offer.desc}</p>
              <div class="offer-pricing">
                ${originalHTML}
                <span class="offer-price">₹${offer.offerPrice}</span>
              </div>
            </div>
          </div>`;
      }).join('');

      return `
        <div class="carousel-track">
          <div class="carousel-set">${cardsHTML}</div>
          <div class="carousel-set" aria-hidden="true">${cardsHTML}</div>
        </div>
      `;
    }

    window.initializeOffers = function(todays, combos) {
      document.getElementById('todaysOffersContainer').innerHTML = renderOfferCards(todays);
      document.getElementById('comboOffersContainer').innerHTML = renderOfferCards(combos);

      document.querySelectorAll('.carousel-track').forEach(track => {
        let pauseTimeout;
        const pause = () => {
          track.classList.add('paused');
          clearTimeout(pauseTimeout);
        };
        const resume = () => {
          pauseTimeout = setTimeout(() => {
            track.classList.remove('paused');
          }, 1500);
        };
        track.addEventListener('mouseenter', pause);
        track.addEventListener('mouseleave', resume);
        track.addEventListener('touchstart', pause, {passive: true});
        track.addEventListener('touchend', resume, {passive: true});
      });
    };

    function animateOffers() {
      const wrappers = document.querySelectorAll('.carousel-wrapper');
      const cta = document.getElementById('viewMenuCta');
      wrappers.forEach(w => w.classList.remove('visible'));
      cta.classList.remove('visible');
      setTimeout(() => {
        wrappers.forEach((w, i) => setTimeout(() => w.classList.add('visible'), 150 + i * 140));
        setTimeout(() => cta.classList.add('visible'), 150 + wrappers.length * 140 + 100);
      }, 50);
    }

    /* ────────────────────────────────────────
       SPLASH LOGIC
    ──────────────────────────────────────── */
    const splash = document.getElementById('splash');
    let splashDismissed = false;
    function dismissSplash() {
      if (splashDismissed) return;
      splashDismissed = true;
      splash.classList.add('hidden');
      showScreen('screenOffers', false);
      setTimeout(animateOffers, 400);
    }
    let splashTime = 2200;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      splashTime = 800;
    }
    setTimeout(dismissSplash, splashTime);
    splash.addEventListener('click', dismissSplash);

    /* ────────────────────────────────────────
       TRANSITION TO SCREEN 3 (Grid)
    ──────────────────────────────────────── */
    document.getElementById('viewMenuCta').addEventListener('click', () => {
      showScreen('screenGrid');
      // Trigger grid stagger
      setTimeout(() => {
        document.querySelectorAll('.cat-tile').forEach((tile, i) => {
          tile.classList.remove('visible');
          setTimeout(() => tile.classList.add('visible'), i * 80);
        });
      }, 50);
    });

    /* ────────────────────────────────────────
       SCREEN 3: RENDER CATEGORY GRID
    ──────────────────────────────────────── */
    const gridContainer = document.getElementById('categoryGrid');
    
    // Default loading state
    gridContainer.innerHTML = `
      <div style="grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 0; gap: 16px;">
        <div style="width: 48px; height: 48px; opacity: 0.7; animation: pulse 1.5s infinite ease-in-out;">
          ${SVG_ARCH_ICON}
        </div>
        <div style="font-family: var(--font-body); font-size: 12px; color: var(--royal-gold); letter-spacing: 1px; text-transform: uppercase; opacity: 0.8;">Loading Menu...</div>
      </div>
      <style>
        @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.5; } 50% { transform: scale(1.05); opacity: 0.8; } 100% { transform: scale(0.95); opacity: 0.5; } }
      </style>
    `;

    window.initializeMenu = function(docs) {
      allMenuItems = docs;
      
      const categoryMap = new Map();
      allMenuItems.forEach(item => {
        if (!categoryMap.has(item.category)) categoryMap.set(item.category, 0);
        if (item.available) categoryMap.set(item.category, categoryMap.get(item.category) + 1);
      });

      const uniqueCategories = Array.from(categoryMap.keys());
      
      uniqueCategories.sort((a, b) => {
        let indexA = categoryOrder.indexOf(a);
        let indexB = categoryOrder.indexOf(b);
        if (indexA === -1) indexA = 999;
        if (indexB === -1) indexB = 999;
        return indexA - indexB;
      });

      gridContainer.innerHTML = uniqueCategories.map((cat, i) => {
        const count = categoryMap.get(cat);
        return `
        <div class="cat-tile" data-cat-id="${cat}">
          <div class="cat-tile-content">
            <div class="cat-tile-name">${cat}</div>
            <div class="cat-tile-count">${count} items</div>
          </div>
        </div>
      `}).join('');

      gridContainer.querySelectorAll('.cat-tile').forEach((tile, i) => {
        tile.addEventListener('click', () => showCategoryDetail(tile.dataset.catId));
        setTimeout(() => tile.classList.add('visible'), i * 80);
      });
    };

    window.showMenuError = function(errMessage) {
      gridContainer.innerHTML = `
        <div style="grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; text-align: center;">
          <p style="font-family: var(--font-body); font-size: 14px; color: var(--muted-cream); line-height: 1.5;">Menu is temporarily unavailable, please try again.<br><br><span style="color:red;font-size:12px;">Error: ${errMessage}</span></p>
        </div>
      `;
    };

    /* ────────────────────────────────────────
       SEARCH LOGIC
    ──────────────────────────────────────── */
    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const searchResultsContainer = document.getElementById('searchResultsContainer');
    
    let searchDebounce;
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      clearTimeout(searchDebounce);
      
      if (query.length > 0) {
        clearSearchBtn.classList.add('visible');
      } else {
        clearSearchBtn.classList.remove('visible');
      }

      searchDebounce = setTimeout(() => {
        if (query === '') {
          searchResultsContainer.style.display = 'none';
          gridContainer.style.display = '';
        } else {
          gridContainer.style.display = 'none';
          searchResultsContainer.style.display = 'block';
          
          const results = allMenuItems.filter(item => item.available && item.name.toLowerCase().includes(query));
          
          if (results.length === 0) {
            searchResultsContainer.innerHTML = `
              <div style="padding: 40px 20px; text-align: center;">
                <p style="font-family: var(--font-body); font-size: 14px; color: var(--muted-cream);">No dishes found for '${e.target.value}'</p>
              </div>`;
            return;
          }

          searchResultsContainer.innerHTML = results.map(dish => {
            const vegValue = dish.veg ? dish.veg.toLowerCase() : '';
            let vegClass = '';
            if (vegValue === 'non-veg' || vegValue === 'egg') vegClass = ' non-veg';

            let badgeHTML = '';
            if (dish.badge && dish.badge.toLowerCase() === 'bestseller') badgeHTML = `<span class="badge">${SVG_STAR} Bestseller</span>`;
            if (dish.badge && dish.badge.toLowerCase() === 'chef') badgeHTML = `<span class="badge">${SVG_FLAME} Chef's Special</span>`;
            
            return `
              <div class="dish-card visible" style="margin-bottom: 12px; cursor: pointer;" onclick="showCategoryDetail('${dish.category}')">
                <div class="dish-thumb">
                  <div class="dish-thumb-placeholder">${SVG_LEAF}</div>
                  <img src="${dish.image}" alt="${dish.name}" data-placeholder="true" onerror="handleImgError(this)" loading="lazy">
                  <span class="veg-indicator${vegClass}"><span class="dot"></span></span>
                </div>
                <div class="dish-body">
                  <div class="dish-top-row">
                    <div class="dish-info">
                      <div class="search-result-cat-label">${dish.category}</div>
                      ${badgeHTML ? `<div class="dish-meta">${badgeHTML}</div>` : ''}
                      <h3 class="dish-name">${dish.name}</h3>
                      ${dish.priceOptions ? `<div class="dish-price-options">${dish.priceOptions.map(opt => `<div class="price-pill"><span class="pill-label">${opt.label}</span><span class="pill-value">₹${opt.price}</span></div>`).join('')}</div>` : ''}
                    </div>
                    ${dish.priceOptions ? '' : `<span class="dish-price">₹${dish.price}</span>`}
                  </div>
                </div>
              </div>`;
          }).join('');
        }
      }, 200);
    });

    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchInput.dispatchEvent(new Event('input'));
    });

    /* ────────────────────────────────────────
       SCREEN 4: RENDER CATEGORY DETAIL
    ──────────────────────────────────────── */
    const detailContent = document.getElementById('detailContent');
    let currentCatId = null;

    function showCategoryDetail(catId) {
      currentCatId = catId;
      document.getElementById('detailCatTitle').textContent = catId;
      
      const dishes = allMenuItems.filter(c => c.category === catId && c.available === true);

      // Render Content
      detailContent.innerHTML = dishes.map(dish => {
        const vegValue = dish.veg ? dish.veg.toLowerCase() : '';
        let vegClass = '';
        if (vegValue === 'non-veg') vegClass = ' non-veg';
        else if (vegValue === 'egg') vegClass = ' non-veg';

        let badgeHTML = '';
        if (dish.badge && dish.badge.toLowerCase() === 'bestseller') badgeHTML = `<span class="badge">${SVG_STAR} Bestseller</span>`;
        if (dish.badge && dish.badge.toLowerCase() === 'chef') badgeHTML = `<span class="badge">${SVG_FLAME} Chef's Special</span>`;
        return `
          <div class="dish-card">
            <div class="dish-thumb">
              <div class="dish-thumb-placeholder">${SVG_LEAF}</div>
              <img src="${dish.image}" alt="${dish.name}" data-placeholder="true" onerror="handleImgError(this)" loading="lazy">
              <span class="veg-indicator${vegClass}"><span class="dot"></span></span>
            </div>
            <div class="dish-body">
              <div class="dish-top-row">
                <div class="dish-info">
                  ${badgeHTML ? `<div class="dish-meta">${badgeHTML}</div>` : ''}
                  <h3 class="dish-name">${dish.name}</h3>
                  ${dish.desc ? `<p class="dish-desc">${dish.desc}</p>` : ''}
                  ${dish.priceOptions ? `<div class="dish-price-options">${dish.priceOptions.map(opt => `<div class="price-pill"><span class="pill-label">${opt.label}</span><span class="pill-value">₹${opt.price}</span></div>`).join('')}</div>` : ''}
                </div>
                ${dish.priceOptions ? '' : `<span class="dish-price">₹${dish.price}</span>`}
              </div>
            </div>
          </div>`;
      }).join('');

      showScreen('screenDetail');
      
      // Stagger dish cards
      setTimeout(() => {
        detailContent.querySelectorAll('.dish-card').forEach((card, i) => {
          setTimeout(() => card.classList.add('visible'), i * 70);
        });
      }, 50);
    }

    document.getElementById('backBtn').addEventListener('click', () => {
      history.back();
    });

    document.getElementById('backToOffersBtn').addEventListener('click', () => {
      history.back();
    });


    /* ────────────────────────────────────────
       SCROLL EFFECTS
    ──────────────────────────────────────── */
    const header = document.getElementById('site-header');
    window.addEventListener('scroll', () => {
      header.classList.toggle('compact', window.scrollY > 60);
    }, { passive: true });

    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });
    document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));

  </script>

  <!-- Initialize Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBbcFeFW52gIEnEkDdqsiaBlR6QxxlhNso",
      authDomain: "the-grand-masala-hut.firebaseapp.com",
      projectId: "the-grand-masala-hut",
      storageBucket: "the-grand-masala-hut.firebasestorage.app",
      messagingSenderId: "149678294402",
      appId: "1:149678294402:web:7297bdd77d4b8333083b9b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Fetch initial data
    async function fetchMenu() {
      try {
        const snapshot = await getDocs(collection(db, "menuItems"));
        const docs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        if (window.initializeMenu) {
          window.initializeMenu(docs);
        }
        
        // Fetch Offers
        const todaysSnap = await getDocs(collection(db, "todaysOffers"));
        const todays = todaysSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        
        const combosSnap = await getDocs(collection(db, "comboOffers"));
        const combos = combosSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        
        if (window.initializeOffers) {
          window.initializeOffers(todays, combos);
        }
      } catch (err) {
        console.error("Failed to fetch menu items from Firestore:", err);
        if (window.showMenuError) {
          window.showMenuError(err.message);
        }
      }
    }

    fetchMenu();
  </script>
</body>
